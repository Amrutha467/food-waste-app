<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Food Waste Dashboard</title>

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:
  linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
  url('https://images.unsplash.com/photo-1556910103-1c02745aae4d?q=80&w=1400');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  min-height:100vh;
  overflow-x:hidden;
}

/* FLOATING FOODS */
.food{
  position:fixed;
  width:80px;
  opacity:0.18;
  animation:float 16s linear infinite;
  z-index:-1;
}

.food1{ left:5%; animation-duration:13s; }
.food2{ left:25%; animation-duration:17s; }
.food3{ left:45%; animation-duration:15s; }
.food4{ left:65%; animation-duration:20s; }
.food5{ left:85%; animation-duration:12s; }

@keyframes float{
  0%{
    transform:translateY(100vh) rotate(0deg);
  }

  100%{
    transform:translateY(-120vh) rotate(360deg);
  }
}

/* HEADER */
header{
  width:100%;
  padding:22px;
  text-align:center;
  color:white;
  font-size:32px;
  font-weight:700;
  letter-spacing:1px;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(10px);
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

/* CONTAINER */
.container{
  width:92%;
  margin:auto;
  padding:25px 0;
}

/* TOP BUTTONS */
.top-buttons{
  display:flex;
  gap:15px;
  margin-bottom:25px;
  flex-wrap:wrap;
}

.btn{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  transition:0.3s;
  color:white;
  box-shadow:0 5px 12px rgba(0,0,0,0.2);
}

.home{
  background:#3498db;
}

.refresh{
  background:#2ecc71;
}

.btn:hover{
  transform:translateY(-3px) scale(1.03);
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  padding:30px;
  border-radius:20px;
  color:white;
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(10px);
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-6px);
}

.card::before{
  content:'';
  position:absolute;
  width:150px;
  height:150px;
  background:rgba(255,255,255,0.15);
  border-radius:50%;
  top:-50px;
  right:-50px;
}

.total{
  background:linear-gradient(135deg,#3498db,#2980b9);
}

.pending{
  background:linear-gradient(135deg,#f39c12,#e67e22);
}

.picked{
  background:linear-gradient(135deg,#2ecc71,#27ae60);
}

.card h2{
  font-size:38px;
  margin-bottom:10px;
}

.card p{
  font-size:18px;
  opacity:0.95;
}

/* CHART AREA */
.chart-section{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
  gap:25px;
  margin-bottom:30px;
}

.chart-box{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:25px;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

.chart-box h3{
  color:white;
  margin-bottom:20px;
  text-align:center;
  font-size:22px;
}

/* TABLE */
.table-container{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#2ecc71;
  color:white;
  padding:16px;
  font-size:16px;
}

td{
  padding:15px;
  text-align:center;
  color:white;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

tr:hover{
  background:rgba(255,255,255,0.08);
}

.pending-text{
  color:#ffd166;
  font-weight:600;
}

.picked-text{
  color:#80ed99;
  font-weight:600;
}

/* RESPONSIVE */
@media(max-width:768px){

  header{
    font-size:24px;
  }

  .chart-section{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<!-- FLOATING FOOD IMAGES -->
<img src="https://cdn-icons-png.flaticon.com/512/1046/1046784.png" class="food food1">
<img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png" class="food food2">
<img src="https://cdn-icons-png.flaticon.com/512/1046/1046751.png" class="food food3">
<img src="https://cdn-icons-png.flaticon.com/512/135/135620.png" class="food food4">
<img src="https://cdn-icons-png.flaticon.com/512/3075/3075978.png" class="food food5">

<header>
  📊 Food Waste Management Dashboard
</header>

<div class="container">

  <!-- TOP BUTTONS -->
  <div class="top-buttons">

    <button class="btn home"
    onclick="window.location.href='index.html'">
      🏠 Home
    </button>

    <button class="btn refresh"
    onclick="loadDashboard()">
      🔄 Refresh
    </button>

  </div>

  <!-- CARDS -->
  <div class="cards">

    <div class="card total">
      <h2 id="total">0</h2>
      <p>Total Donations</p>
    </div>

    <div class="card pending">
      <h2 id="pending">0</h2>
      <p>Pending Requests</p>
    </div>

    <div class="card picked">
      <h2 id="picked">0</h2>
      <p>Food Picked</p>
    </div>

  </div>

  <!-- CHARTS -->
  <div class="chart-section">

    <div class="chart-box">
      <h3>🍱 Food Status Distribution</h3>
      <canvas id="pieChart"></canvas>
    </div>

    <div class="chart-box">
      <h3>📈 Collection Analytics</h3>
      <canvas id="barChart"></canvas>
    </div>

  </div>

  <!-- TABLE -->
  <div class="table-container">

    <table>

      <thead>
        <tr>
          <th>Food</th>
          <th>Quantity</th>
          <th>Location</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="table"></tbody>

    </table>

  </div>

</div>

<script>

const BASE = "http://localhost:5000";

let pieChart;
let barChart;

async function loadDashboard(){

  try{

    const res = await fetch(BASE + "/foods");
    const data = await res.json();

    const totalFoods = data.length;

    const pendingFoods =
      data.filter(f=>f.status==="Pending").length;

    const pickedFoods =
      data.filter(f=>f.status==="Picked").length;

    // UPDATE CARDS
    document.getElementById("total").innerText =
      totalFoods;

    document.getElementById("pending").innerText =
      pendingFoods;

    document.getElementById("picked").innerText =
      pickedFoods;

    // TABLE
    const table = document.getElementById("table");

    table.innerHTML = "";

    data.forEach(f=>{

      table.innerHTML += `
      <tr>

        <td>${f.type}</td>

        <td>${f.quantity}</td>

        <td>${f.location}</td>

        <td class="${
          f.status==="Picked"
          ? "picked-text"
          : "pending-text"
        }">

          ${f.status}

        </td>

      </tr>
      `;

    });

    // DESTROY OLD CHARTS
    if(pieChart){
      pieChart.destroy();
    }

    if(barChart){
      barChart.destroy();
    }

    // PIE CHART
    pieChart = new Chart(
      document.getElementById("pieChart"),
      {

        type:'doughnut',

        data:{
          labels:[
            'Pending',
            'Picked'
          ],

          datasets:[{
            data:[
              pendingFoods,
              pickedFoods
            ],

            backgroundColor:[
              '#f39c12',
              '#2ecc71'
            ],

            borderWidth:0
          }]
        },

        options:{
          plugins:{
            legend:{
              labels:{
                color:'white',
                font:{
                  size:14
                }
              }
            }
          }
        }

      }
    );

    // BAR CHART
    barChart = new Chart(
      document.getElementById("barChart"),
      {

        type:'bar',

        data:{
          labels:[
            'Total',
            'Pending',
            'Picked'
          ],

          datasets:[{
            label:'Food Count',

            data:[
              totalFoods,
              pendingFoods,
              pickedFoods
            ],

            backgroundColor:[
              '#3498db',
              '#f39c12',
              '#2ecc71'
            ],

            borderRadius:10
          }]
        },

        options:{
          scales:{

            y:{
              beginAtZero:true,

              ticks:{
                color:'white'
              },

              grid:{
                color:'rgba(255,255,255,0.1)'
              }
            },

            x:{
              ticks:{
                color:'white'
              },

              grid:{
                color:'rgba(255,255,255,0.1)'
              }
            }

          },

          plugins:{
            legend:{
              labels:{
                color:'white'
              }
            }
          }
        }

      }
    );

  }

  catch(err){

    console.log(err);

    alert("Dashboard failed to load ❌");
  }

}

loadDashboard();

</script>

</body>
</html>
