<!DOCTYPE html>
<html>
<head>
<title>Admin Manage</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
}

header {
  background: #2980b9;
  color: white;
  padding: 15px;
  text-align: center;
}

table {
  width: 90%;
  margin: 20px auto;
  background: white;
  border-collapse: collapse;
}

th, td {
  padding: 10px;
  border: 1px solid #ddd;
  text-align: center;
}

th {
  background: #3498db;
  color: white;
}

input {
  width: 90%;
}

button {
  padding: 5px 10px;
  margin: 2px;
  border: none;
  color: white;
  cursor: pointer;
}

.save { background: green; }
.delete { background: red; }
.back { background: #2ecc71; margin: 10px; }
</style>
</head>

<body>

<header>⚙️ Admin Manage Food</header>

<button class="back" onclick="goBack()">⬅ Back</button>

<table>
<thead>
<tr>
<th>Food</th>
<th>Qty</th>
<th>Location</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>
const BASE="http://localhost:5000";

async function load(){
  const data=await (await fetch(BASE+"/foods")).json();
  table.innerHTML="";

  data.forEach((f,i)=>{
    table.innerHTML+=`
    <tr>
      <td><input value="${f.type}" id="t${i}"></td>
      <td><input value="${f.quantity}" id="q${i}"></td>
      <td><input value="${f.location}" id="l${i}"></td>
      <td>${f.status}</td>
      <td>
        <button class="save" onclick="save(${i})">Save</button>
        <button class="delete" onclick="del(${i})">Delete</button>
      </td>
    </tr>`;
  });
}

async function save(i){
  const updated={
    type:document.getElementById(`t${i}`).value,
    quantity:document.getElementById(`q${i}`).value,
    location:document.getElementById(`l${i}`).value,
    status:"Pending"
  };

  await fetch(BASE+"/delete-food/"+i,{method:"DELETE"});
  await fetch(BASE+"/add-food",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(updated)
  });

  load();
}

async function del(i){
  await fetch(BASE+"/delete-food/"+i,{method:"DELETE"});
  load();
}

function goBack(){
  location="index.html";
}

load();
</script>

</body>
</html>
